{% extends "base.html"%}
{% block content %}

<div style="padding: 20px;">
    <h1>{{user.username}}'s Profile</h1>
    <table>
        <tbody>
            <tr>
                <td>Username: {{ user.username}}</td>
            </tr>
            <tr>
                <td>Email: {{ user.email }}</td>
            </tr>
            <tr>
                <td>About Me: {{ user.about_me}}</td>
            </tr>
            <tr>
              <td>Last Seen: {{ user.last_seen}}</td>
            </tr>
        </tbody>
    </table>

</div>

{% endblock %}
